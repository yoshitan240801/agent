openapi: 3.0.1

info:
  title: Underwear Agentic Search API
  version: "1.0.0"
  description: |
    ブラジャーおよびショーツの商品を自然文で検索するAI検索API。

    ユーザが入力した検索条件をOpenSearch Agentic Searchへ渡し、
    商品名、商品説明、商品詳細、商品画像、サイズ、価格などを考慮して
    OpenSearch側で検索DSLを自動生成して商品を検索する。

    このツールは「1回の呼び出しにつき、1つの商品カテゴリを検索する」ことを基本とする。

    重要:
    - ブラジャーを検索する場合は、queryに「ブラジャー」を含めること。
    - ショーツを検索する場合は、queryに「ショーツ」を含めること。
    - ブラジャーとショーツの両方が要求された場合、このツールを2回呼び出すこと。
    - その場合、1回目はブラジャーだけを対象とする検索条件、
      2回目はショーツだけを対象とする検索条件に分けること。
    - 1回のqueryに「ブラジャー」と「ショーツ」の両方を含めて、
      両カテゴリを同時に検索しようとしないこと。

servers:
  - url: http://host.docker.internal:10002

paths:

  /search_bra_and_panty_by_opensearch_agentic_search:

    post:

      operationId: searchUnderwearByAgenticSearch

      summary: ブラジャーまたはショーツを自然文で検索する

      description: |
        ブラジャーまたはショーツの商品を自然文で検索する。

        1回のツール呼び出しでは、原則として1つの商品カテゴリのみを検索する。

        【ブラジャー検索】

        queryには必ず「ブラジャー」というカテゴリを明示する。

        例:
        - 赤系で華やかなブラジャー
        - 上品なレースのブラジャー
        - 黒で高級感のあるブラジャー
        - 谷間を作れるブラジャー
        - パッド付きのブラジャー
        - ワイヤー入りで15000円以下のブラジャー
        - C70で可愛いブラジャー


        【ショーツ検索】

        queryには必ず「ショーツ」というカテゴリを明示する。

        例:
        - 赤系で華やかなショーツ
        - レースのショーツ
        - 黒でセクシーなショーツ
        - 可愛いショーツ
        - 大人っぽいショーツ
        - Mサイズで10000円以下のショーツ


        【ブラジャーとショーツの両方が要求された場合】

        ユーザが以下のように入力した場合:

        「ブラジャーとショーツの両方でオシャレなものを探して」

        1回のツール呼び出しで両方を検索してはいけない。

        以下の2回に分けてツールを呼び出す。

        1回目:
        「ブラジャーでオシャレなもの」

        2回目:
        「ショーツでオシャレなもの」

        また、

        「赤系のブラジャーとショーツ」
        
        の場合は、

        1回目:
        「赤系のブラジャー」

        2回目:
        「赤系のショーツ」

        として検索する。

        共通する検索条件は両方のqueryに引き継ぐこと。

        【検索条件】

        以下のような自然文による条件をそのままqueryへ含めること。

        - 色、雰囲気、デザイン
        - 素材
        - 機能
        - サイズ
        - 価格
        - その他の商品特徴

        OpenSearch Agentic Searchが検索方法を自動的に決定するため、
        queryをキーワード列やDSLへ変換する必要はない。

        【重要】

        このAPIはカテゴリを引数として別途受け取らない。

        そのため、カテゴリ判定はDifyエージェント側で行い、
        queryの中に「ブラジャー」または「ショーツ」を明示的に含めること。

      requestBody:
        required: true

        content:
          application/json:

            schema:
              type: object

              required:
                - query

              properties:

                query:
                  type: string

                  description: |
                    1つの商品カテゴリを対象とした自然文の検索条件。

                    必ず「ブラジャー」または「ショーツ」のどちらか一方を
                    query内に含めること。

                    「ブラジャー」と「ショーツ」の両方を同時に含めてはいけない。

                  examples:

                    bra:
                      summary: ブラジャー検索
                      value: "赤系で華やかなブラジャー"

                    panty:
                      summary: ショーツ検索
                      value: "赤系で華やかなショーツ"

      responses:

        "200":

          description: 商品検索成功

          content:

            application/json:

              schema:

                type: object

                properties:

                  dsl_query:
                    type: object
                    description: OpenSearch Agentic Searchが生成したDSL

                  results:
                    type: array
                    description: 検索結果一覧

                    items:

                      type: object

                      properties:

                        rank:
                          type: integer
                          description: 検索結果の順位

                        score:
                          type: number
                          description: OpenSearchの検索スコア

                        product:
                          type: string
                          description: 商品コード

                        category:
                          type: string
                          description: 商品カテゴリ

                        name:
                          type: string
                          description: 商品名

                        description:
                          type: string
                          description: 商品説明

                        detail:
                          type: array
                          description: 商品詳細
                          items:
                            type: string

                        image_url:
                          type: string
                          description: 商品画像Markdown

                        product_url:
                          type: string
                          description: 商品ページURL

                        size_price:
                          type: array
                          description: サイズごとの価格
                          items:
                            type: object
                            properties:
                              size:
                                type: string
                              price:
                                type: number

        "500":

          description: システムエラー